<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="auto">
  <style>
    .label { font-family: sans-serif; font-weight: bold; font-size: 14px; fill: #555; text-anchor: middle; }
    .sublabel { font-family: sans-serif; font-size: 11px; fill: #888; text-anchor: middle; }
  </style>

  <!-- 1. GRIZZLY BEAR (Distinct shoulder hump, dish-shaped face profile) -->
  <g transform="translate(10, 20)">
    <ellipse cx="130" cy="235" rx="110" ry="8" fill="#e0e0e0" />
    <path d="M 35 230 L 30 200 Q 28 170 35 155 Q 45 140 60 145 Q 70 120 90 95 Q 110 75 130 80 Q 145 85 155 105 C 175 110 195 120 210 140 C 220 150 235 155 240 165 C 245 175 240 185 230 185 C 220 185 210 178 200 175 Q 190 190 185 230 L 165 230 Q 170 195 160 175 Q 140 180 115 178 L 105 230 L 85 230 L 92 175 Q 65 170 50 190 L 50 230 Z" fill="#4a3525" />
    <path d="M 95 98 C 110 82 128 85 140 98 C 120 105 105 105 95 98 Z" fill="#684c37" />
    <path d="M 210 140 Q 225 148 238 165 Q 225 170 215 165 Q 200 152 210 140 Z" fill="#362519" />
    <circle cx="212" cy="148" r="2" fill="#111" />
    <text x="135" y="260" class="label">GRIZZLY BEAR</text>
    <text x="135" y="275" class="sublabel">Ursus arctos horribilis</text>
  </g>

  <!-- 2. BLACK BEAR (Straight facial profile, no prominent hump, compact frame) -->
  <g transform="translate(310, 20)">
    <ellipse cx="130" cy="235" rx="100" ry="8" fill="#e0e0e0" />
    <path d="M 45 230 L 40 195 Q 38 165 50 145 Q 65 125 90 118 Q 120 115 145 125 C 165 130 185 140 205 152 C 220 160 225 168 220 175 C 212 180 200 178 192 172 Q 180 185 175 230 L 155 230 Q 160 190 150 170 Q 130 172 110 170 L 100 230 L 82 230 L 88 170 Q 68 170 58 190 L 58 230 Z" fill="#1c1c1c" />
    <path d="M 190 155 C 205 162 222 168 220 175 C 212 180 200 178 192 172 Z" fill="#c49a6c" />
    <circle cx="196" cy="158" r="2" fill="#000" />
    <path d="M 218 171 Q 221 172 219 175 Q 215 176 216 172 Z" fill="#0c0c0c" />
    <text x="130" y="260" class="label">BLACK BEAR</text>
    <text x="130" y="275" class="sublabel">Ursus americanus</text>
  </g>

  <!-- 3. POLAR BEAR (Long tapered neck, Roman nose, heavy rear build) -->
  <g transform="translate(600, 20)">
    <ellipse cx="140" cy="235" rx="110" ry="8" fill="#e0e0e0" />
    <path d="M 35 230 L 30 190 Q 30 150 45 130 Q 70 100 105 105 Q 135 110 160 125 C 185 135 215 145 240 155 C 255 160 258 168 250 173 C 238 178 225 175 215 168 Q 195 185 190 230 L 168 230 Q 175 190 162 170 Q 140 172 118 170 L 108 230 L 85 230 L 92 170 Q 68 170 52 190 L 48 230 Z" fill="#f0eedf" stroke="#d6d2c4" stroke-width="1.5" />
    <path d="M 246 166 C 252 167 254 171 248 173 C 244 174 242 170 246 166 Z" fill="#111" />
    <circle cx="225" cy="154" r="2.5" fill="#111" />
    <path d="M 105 105 Q 135 110 160 125" fill="none" stroke="#dcd8c8" stroke-width="3" />
    <path d="M 45 130 Q 70 100 105 105" fill="none" stroke="#e2ded0" stroke-width="3" />
    <text x="140" y="260" class="label">POLAR BEAR</text>
    <text x="140" y="275" class="sublabel">Ursus maritimus</text>
  </g>
</svg>